locale: en-US
title: Qilin Huang
title_separator: "|"
name: &name Qilin Huang
description: "Qilin Huang, a Computer Vision master's student at Carnegie Mellon University, works on 3D physics and visual reasoning and seeks Summer 2027 CV/ML engineering and applied ML internships."
url: https://fanwize.github.io
baseurl: ""
repository: Fanwize/Fanwize.github.io
timezone: America/New_York

author:
  name: *name
  bio: M.S. in Computer Vision
  affiliation: &affiliation Carnegie Mellon University
  location: Pittsburgh, PA
  email: qilinhua@andrew.cmu.edu
  github: Fanwize

career:
  degree: M.S. in Computer Vision
  institution: *affiliation
  graduation: December 2027
  target: Seeking Summer 2027 internships in CV/ML engineering and applied ML.
  resume:
    path: /files/cv_qilin_huang_26_fall.pdf
  skills:
    - label: Programming
      items: [Python, Java, C/C++, SQL]
    - label: Libraries & Tools
      items: [PyTorch, NumPy, scikit-learn, Linux, SLURM]

social:
  type: Person
  name: *name
  links:
    - https://github.com/Fanwize
future: false

include:
  - _pages
  - hcnqa-poster.webp
  - hcnqa-teaser.mp4
  - unipixie-teaser-320.webp
  - unipixie-teaser-640.webp
  - unipixie-teaser-960.webp
  - social-preview.png
  - favicon.svg
  - cv_qilin_huang_26_fall.pdf
  - assets/fonts/inter-variable.woff2
  - assets/fonts/inter-LICENSE.txt
exclude:
  - _planning
  - "*_Guide.md"
  - AGENTS.md
  - CLAUDE.md
  - scripts
  - requirements-dev.txt
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - .dockerignore
  - .github
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - .idea
  - .vscode
  - .venv
  - local
  - tmp
  - vendor
  - node_modules
  - _posts
  - "files/*"
  - "images/*"

encoding: utf-8
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
collections:
  publications:
    output: false
  research:
    output: true
    permalink: /research/:path/
  portfolio:
    output: true
    permalink: /portfolio/:path/
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
